field_patterns:
  fdr_number:
    regex: "(?:Deposit\\s*Certificate\\s*No\\.?|FDR\\s*No\\.?|Instrument\\s*#)[\\s:]*([A-Z0-9\\-\\/]{6,25})"
    expected_bbox: [50, 110, 220, 25]
  amount:
    regex: "(?:Principal\\s*Amount|Deposit\\s*Sum)[\\s:]*(?:Rs\\.?|₹|INR)?[\\s]*([\\d,]+(?:\\.\\d{2})?)"
    expected_bbox: [350, 110, 200, 25]
  amount_words:
    regex: "(?:In\\s*Words|Rupees)[\\s:]*([A-Za-z\\s]+(?:Lakh|Crore|Thousand|Only))"
    expected_bbox: [50, 140, 500, 25]
  issue_date:
    regex: "(?:Date\\s*of\\s*Receipt|Issue\\s*Date)[\\s:]*([0-9a-zA-Z\\-\\/]{8,15})"
    expected_bbox: [50, 170, 200, 25]
  maturity_date:
    regex: "(?:Repayment\\s*Date|Maturity\\s*Date)[\\s:]*([0-9a-zA-Z\\-\\/]{8,15})"
    expected_bbox: [350, 170, 200, 25]
  interest_rate:
    regex: "(?:Interest\\s*p\\.a\\.|Rate)[\\s:]*([\\d\\.]+)\\s*%"
    expected_bbox: [50, 200, 150, 25]
  depositor_name:
    regex: "(?:Deposited\\s*by|Account\\s*Holder)[\\s:]*([^\\n,]+)"
    expected_bbox: [50, 230, 400, 25]
  lien_clause:
    regex: "(Marked\\s*under\\s*Lien\\s*to\\s*Regional\\s*Officer.*?(?:AICTE).*?\\.)"
    expected_bbox: [50, 270, 500, 45]
confidence_baseline: 0.95
