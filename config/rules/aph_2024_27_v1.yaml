# ==============================================================================
# AICTE APPROVAL PROCESS HANDBOOK (APH) - REGULATORY SECURITY DEPOSIT RULES
# Version: APH-2024-27.v1 (Baseline)
# NOTE: ALL values are illustrative placeholders, configurable by AICTE Admin.
# ==============================================================================

version_tag: "APH-2024-27.v1"
handbook_edition: "AICTE Approval Process Handbook (APH) 2024-2027"
effective_from: "2024-04-01"
effective_to: null
is_active: true
description: "AICTE APH 2024-27 Security Deposit Baseline Rules"
disclaimer: "ILLUSTRATIVE PLACEHOLDERS - configurable by AICTE Admin"
statutory_disclaimer_hi: "सभी नियम और मान उदाहरणार्थ सांकेतिक हैं - एआईसीटीई व्यवस्थापक द्वारा विन्यास योग्य"

# Granular Rules Definition
rules:
  # 1. Minimum Deposit Amount Norm (INR)
  - rule_id: "RULE-MIN-AMOUNT-01"
    description: "Prescribed Minimum Security Deposit (FDR) Principal Amount"
    description_hi: "निर्धारित न्यूनतम सुरक्षा जमा (एफडीआर) मूल राशि"
    type: "min_amount"
    severity: "CRITICAL"
    handbook_reference: "APH 2024-27 Chapter I, Clause 1.4(b) [Placeholder]"
    effective_from: "2024-04-01"
    effective_to: null
    applies_to:
      institution_category: "ALL"
      program_level: "ALL"
    parameters:
      deposit_norms_inr:
        "Engineering & Technology":
          "UG": 3500000
          "PG": 2500000
          "Diploma": 1500000
        "Management":
          "PG": 1500000
          "UG": 1000000
        "Pharmacy":
          "UG": 2500000
          "Diploma": 1500000
        "Architecture & Town Planning":
          "UG": 2000000
        "Applied Arts & Crafts":
          "UG": 1500000
        "General Technical":
          "Default": 2000000
      category_concessions:
        "Women": 0.20        # 20% concession
        "Minority": 0.20     # 20% concession
        "PwD": 0.20          # 20% concession
        "North-East": 0.50   # 50% concession
        "Normal": 0.00

  # 2. Mandatory Tenure & Lock-in Validity
  - rule_id: "RULE-VALIDITY-TENURE-02"
    description: "Mandatory Minimum Lock-in Validity Period"
    description_hi: "अनिवार्य न्यूनतम लॉक-इन वैधता अवधि"
    type: "validity_until"
    severity: "CRITICAL"
    handbook_reference: "APH 2024-27 Chapter I, Clause 1.7 [Placeholder]"
    effective_from: "2024-04-01"
    effective_to: null
    applies_to:
      institution_category: "ALL"
      program_level: "ALL"
    parameters:
      mandatory_minimum_tenure_months: 96  # 8 years lock-in
      tolerance_days_before_expiry: 30

  # 3. Scheduled Commercial Bank Whitelist
  - rule_id: "RULE-BANK-WHITELIST-03"
    description: "Issuing Bank RBI Scheduled Commercial Classification"
    description_hi: "जारीकर्ता बैंक आरबीआई अनुसूचित वाणिज्यिक वर्गीकरण"
    type: "bank_whitelist"
    severity: "HIGH"
    handbook_reference: "APH 2024-27 Chapter II, Regulation 2.3 [Placeholder]"
    effective_from: "2024-04-01"
    effective_to: null
    applies_to:
      institution_category: "ALL"
      program_level: "ALL"
    parameters:
      rbi_scheduled_commercial_banks:
        - "State Bank of India"
        - "Punjab National Bank"
        - "Bank of Baroda"
        - "Canara Bank"
        - "Union Bank of India"
        - "HDFC Bank"
        - "ICICI Bank"
        - "Axis Bank"
        - "Kotak Mahindra Bank"
        - "Bank of India"
        - "Central Bank of India"
        - "Indian Bank"
        - "Bharat National Bank"
        - "Apex Commercial Bank"
        - "Hindustan Mercantile Bank"
      prohibited_categories:
        - "Unregistered Cooperative Societies"
        - "Non-Banking Financial Companies"

  # 4. Mandatory Document Enclosures
  - rule_id: "RULE-DOC-ENCLOSURES-04"
    description: "Mandatory Regulatory Document Verification and Bank Confirmation Enclosure"
    description_hi: "अनिवार्य विनियामक दस्तावेज़ सत्यापन और बैंक पुष्टि संलग्नक"
    type: "required_document"
    severity: "HIGH"
    handbook_reference: "APH 2024-27 Annexure 4 [Placeholder]"
    effective_from: "2024-04-01"
    effective_to: null
    applies_to:
      institution_category: "ALL"
      program_level: "ALL"
    parameters:
      required_doc_types:
        - "FDR_CERTIFICATE"
        - "BANK_CONFIRMATION_LETTER"
      allow_substitute_declaration: false

  # 5. Date Logic & Chronological Soundness
  - rule_id: "RULE-DATE-LOGIC-05"
    description: "Deposit Date Sequence & Chronological Validity"
    description_hi: "जमा तिथि अनुक्रम और कालानुक्रमिक वैधता"
    type: "date_logic"
    severity: "CRITICAL"
    handbook_reference: "APH 2024-27 Chapter I, Clause 1.9 [Placeholder]"
    effective_from: "2024-04-01"
    effective_to: null
    applies_to:
      institution_category: "ALL"
      program_level: "ALL"
    parameters:
      maturity_must_follow_issue: true
      maximum_issue_tenure_years: 15
      lien_clause_keywords:
        - "regional officer"
        - "aicte"
        - "all india council for technical education"
        - "lien"
        - "pledged"

  # 6. Release & Refund Conditions Gate
  - rule_id: "RULE-RELEASE-CONDITION-06"
    description: "Statutory Prerequisite Conditions for Deposit Release / Refund"
    description_hi: "जमा विमुक्ति / वापसी के लिए वैधानिक पूर्व-शर्तें"
    type: "release_condition"
    severity: "CRITICAL"
    handbook_reference: "APH 2024-27 Chapter I, Regulation 11 [Placeholder]"
    effective_from: "2024-04-01"
    effective_to: null
    applies_to:
      institution_category: "ALL"
      program_level: "ALL"
    parameters:
      required_status_prior_to_release: "MATURED"
      require_state_noc: true
      require_university_noc: true
      require_zero_pending_grievances: true
      authorized_approver_role: "COMPETENT_AUTHORITY"

